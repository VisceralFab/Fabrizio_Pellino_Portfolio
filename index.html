<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Fabrizio Pellino - UI-UX Designer Portfolio">
    <title>Fabrizio Pellino | UI-UX Designer</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/loading-kernel.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Linux Kernel Boot Loading Screen -->
    <div id="loading-screen">
        <!-- Top left: User and datetime -->
        <div class="boot-info">
            <div class="hostname">VisceralFab</div>
            <div class="datetime">Loading...</div>
        </div>

        <!-- Top center: OutOfTune branding -->
        <div class="boot-branding">
            OutOfTune
        </div>

        <!-- Bottom left: Made with Love -->
        <div class="made-with-love">
            ❤ Made with Love
        </div>

        <!-- Center: Boot messages -->
        <div class="boot-container">
            <div class="boot-messages"></div>

            <div class="boot-prompt">
                <span class="boot-prompt-text">Press any key to continue</span>
                <span class="boot-prompt-cursor"></span>
            </div>
        </div>

        <!-- Bottom: Click hint -->
        <div class="click-hint">
            Click anywhere or press Enter
        </div>
    </div>

    <!-- Main Site Content -->
    <div class="background-glow"></div>
    <div class="scanlines"></div>
    <div class="crt-flicker"></div>
    <div class="crt-vignette"></div>
    <div class="crt-noise"></div>
    <div class="rgb-shift"></div>

    <div class="terminal-window">
        <!-- Terminal Header -->
        <div class="terminal-header">
            <div class="terminal-buttons">
                <span class="btn-close"></span>
                <span class="btn-minimize"></span>
                <span class="btn-maximize"></span>
            </div>
            <div class="terminal-title">
                Fabrizio_Pellino@portfolio:~/home
            </div>
            <div class="terminal-session">bash:~-login</div>
        </div>

        <!-- Navigation Bar -->
        <div class="terminal-navbar">
            <button class="nav-arrow" id="nav-back" title="Back" disabled>
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <button class="nav-arrow" id="nav-forward" title="Forward" disabled>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
            <button class="nav-arrow" id="nav-refresh" title="Refresh">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
            <div class="nav-address-bar">
                <div class="address-icon">
                    <i class="fa-solid fa-folder"></i>
                </div>
                <input type="text" class="address-input" id="address-input" spellcheck="false" value="~/home">
            </div>
        </div>

        <!-- Terminal Body -->
        <div class="terminal-body">
            <!-- App Container - Content loads here -->
            <div id="app-container">
                <!-- Content will be loaded dynamically -->
            </div>
        </div>
    </div>

    <!-- Background audio -->
    <audio id="siteAudio" preload="auto" loop playsinline>
        <source src="assets/media/Background%20music.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <div id="musicControl" aria-label="Background music control" title="Background music">
        <button id="musicToggle" class="music-toggle" title="Toggle background music" aria-pressed="false">
            <i class="fa-solid fa-play" aria-hidden="true"></i>
            <span class="sr-only">Play background music</span>
        </button>
        <span class="music-label">Now playing: Killer Tune Kills Me - Kirinji</span>
        <input id="musicVolume" class="music-volume" type="range" min="0" max="1" step="0.01" aria-label="Music volume">
        <span class="music-percent"></span>
    </div>

    <!-- Scripts -->
    <script src="assets/js/loading-kernel.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/audio.js"></script>
</body>

</html>
