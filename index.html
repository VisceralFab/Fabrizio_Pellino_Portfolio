<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Fabrizio Pellino - UI-UX Designer Portfolio">
    <title>Fabrizio Pellino | UI-UX Designer</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="background-glow"></div>

    <div class="terminal-window">
        <!-- Terminal Header -->
        <div class="terminal-header">
            <div class="terminal-buttons">
                <span class="btn-close"></span>
                <span class="btn-minimize"></span>
                <span class="btn-maximize"></span>
            </div>
            <div class="terminal-title">
                Fabrizio_Pellino@portfolio:~/home
            </div>
            <div class="terminal-session">bash:~-login</div>
        </div>

        <!-- Navigation Bar -->
        <div class="terminal-navbar">
            <button class="nav-arrow" id="nav-back" title="Back" disabled>
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <button class="nav-arrow" id="nav-forward" title="Forward" disabled>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
            <button class="nav-arrow" id="nav-refresh" title="Refresh">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
            <div class="nav-address-bar">
                <input type="text" class="address-input" id="address-input" spellcheck="false" value="~/home">
            </div>
        </div>

        <!-- Terminal Body -->
        <div class="terminal-body" id="app-container">
            <!-- Content will be loaded dynamically -->
            <div class="loading-messages">
                <div class="loading-line">
                    <span class="loading-text">Booting system...</span>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/js/app.js"></script>

    <!-- Background audio + lightweight controls -->
    <audio id="siteAudio" preload="auto" loop playsinline>
        <source src="assets/media/Background%20music.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <div id="musicControl" aria-label="Background music control" title="Background music">
        <button id="musicToggle" class="music-toggle" title="Toggle background music" aria-pressed="false">
            <i class="fa-solid fa-play" aria-hidden="true"></i>
            <span class="sr-only">Play background music</span>
        </button>
        <input id="musicVolume" class="music-volume" type="range" min="0" max="1" step="0.01" aria-label="Music volume">
        <span class="music-percent"></span>
    </div>

    <script src="assets/js/audio.js"></script>
</body>

</html>
