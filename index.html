<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Fabrizio Pellino - UI-UX Designer Portfolio">
    <title>Fabrizio Pellino | UI-UX Designer</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Space+Grotesk:wght@300;400;500;700&family=Fira+Code:wght@400;500;600&family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body>
    <!-- PlayStation 3 XMB-inspired animated background -->
    <canvas id="ps3-background" aria-hidden="true"></canvas>

    <!-- OutOfTune Layout Elements -->
    <div id="landing-wrapper">
        <div id="globe-target"></div>
        
        <div class="landing-center">
            <h1 class="landing-title">Fabrizio Pellino</h1>
            <p class="landing-subtitle">UI-UX Designer — built for product, usability & visual.</p>
        </div>
        
        <p class="landing-hint" id="continue-btn">Click or tap anywhere to continue</p>
    </div>

    <!-- Main Site Content -->
    <div class="terminal-window">
        <!-- Terminal Header -->
        <div class="terminal-header">
            <div class="terminal-buttons">
                <span class="btn-close"></span>
                <span class="btn-minimize"></span>
                <span class="btn-maximize"></span>
            </div>
            <div class="terminal-title">
                Fabrizio_Pellino@portfolio:~/home
            </div>
            <div class="terminal-session">bash:~-login</div>
        </div>

        <!-- Navigation Bar -->
        <div class="terminal-navbar">
            <button class="nav-arrow" id="nav-back" title="Back" disabled>
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <button class="nav-arrow" id="nav-forward" title="Forward" disabled>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
            <button class="nav-arrow" id="nav-refresh" title="Refresh">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
            <div class="nav-address-bar">
                <div class="address-icon">
                    <i class="fa-solid fa-folder"></i>
                </div>
                <input type="text" class="address-input" id="address-input" spellcheck="false" value="~/home">
            </div>
        </div>

        <!-- Terminal Body -->
        <div class="terminal-body">
            <!-- App Container - Content loads here -->
            <div id="app-container">
                <!-- Content will be loaded dynamically -->
            </div>
        </div>
    </div>

    <!-- Background audio -->
    <audio id="siteAudio" preload="auto" loop playsinline>
        <source src="assets/media/Killer%20Tune%20Kills%20Me%20-%20Kirinji.flac" type="audio/flac">
        Your browser does not support the audio element.
    </audio>

    <div id="musicControl" aria-label="Background music control" title="Background music">
        <span class="music-label">Kyuujitsuno Sugoshikakata</span>
        <div class="music-controls-row">
            <button id="musicToggle" class="music-toggle" title="Toggle background music" aria-pressed="false">
                <i class="fa-solid fa-play" aria-hidden="true"></i>
                <span class="sr-only">Play background music</span>
            </button>
            <input id="musicVolume" class="music-volume" type="range" min="0" max="1" step="0.01" aria-label="Music volume">
            <span class="music-percent">8%</span>
        </div>
    </div>

    <!-- Scripts -->
    <script src="assets/js/ps3/background-gradients-night.js"></script>
    <script src="assets/js/ps3/background-gradients-day.js"></script>
    <script src="assets/js/ps3/spline-settings.js"></script>
    <script src="assets/js/ps3/particles-settings.js"></script>
    <script src="assets/js/ps3/spline-reverse.js"></script>
    <script src="assets/js/ps3/spline.js"></script>
    <script src="assets/js/ps3/particles.js"></script>
    <script src="assets/js/ps3-background.js"></script>
    <script src="assets/js/sphere.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/audio.js"></script>
</body>

</html>
